[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charate"
version = "0.1.0"
description = "Local-first character agent framework for creator-owned original characters."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Charate" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
charate = "charate.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
